    <div className="page" onDragOver={e=>{if(tab==='items'){e.preventDefault();setPageDragOver(true);}}} onDragLeave={e=>{if(!e.currentTarget.contains(e.relatedTarget))setPageDragOver(false);}} onDrop={e=>{if(tab!=='items')return;e.preventDefault();setPageDragOver(false);handleMultiDrop(e.dataTransfer.files);}} style={{position:'relative'}}>
      {pageDragOver&&<div style={{position:'absolute',inset:0,background:'rgba(30,111,181,0.10)',border:'3px dashed var(--sky)',borderRadius:16,zIndex:200,display:'flex',alignItems:'center',justifyContent:'center',pointerEvents:'none'}}><div style={{textAlign:'center'}}><div style={{fontSize:'3rem'}}>📸</div><div style={{fontWeight:700,color:'var(--sky)',fontSize:'1.1rem'}}>Drop photos to add items</div><div style={{fontSize:'0.8rem',color:'var(--text2)',marginTop:4}}>Multiple photos OK — auto-analyzed instantly</div></div></div>}
      {bulkAdding&&<div style={{position:'fixed',inset:0,background:'rgba(26,22,36,0.45)',zIndex:500,display:'flex',alignItems:'center',justifyContent:'center',backdropFilter:'blur(4px)'}}><div style={{background:'var(--bg2)',borderRadius:16,padding:'28px 36px',textAlign:'center',boxShadow:'var(--shadow-lg)'}}><div style={{fontSize:'2rem',marginBottom:10}}>⚙️</div><div style={{fontWeight:700,fontSize:'1rem'}}>Analyzing your photos…</div><div style={{fontSize:'0.82rem',color:'var(--text2)',marginTop:6}}>Adding items to your closet</div></div></div>}
      <input ref={multiRef} type="file" accept="image/*" multiple style={{display:'none'}} onChange={e=>{handleMultiDrop(e.target.files);e.target.value='';}}/>
      <div className="flex-between mb-16">
        <div><h2 style={{fontSize:'1.5rem'}}>My Closet</h2><p className="text-sm mt-8">{wardrobe.length} item{wardrobe.length!==1?'s':''} · {savedOutfits.length} outfit set{savedOutfits.length!==1?'s':''}</p></div>
        <div style={{display:'flex',gap:8}}>
          {tab==='items'&&<button className="btn btn-outline btn-sm" onClick={()=>multiRef.current.click()}>📸 Upload Photos</button>}
          <button className="btn btn-sky" onClick={()=>tab==='items'?setShowAdd(true):setShowAddSet(true)}>+ {tab==='items'?'Add Item':'New Set'}</button>
        </div>
      </div>
      <div className="tabs">
        <button className={`tab${tab==='items'?' active':''}`} onClick={()=>setTab('items')}>👗 Items ({wardrobe.length})</button>
        <button className={`tab${tab==='sets'?' active':''}`} onClick={()=>setTab('sets')}>🧩 Outfit Sets ({savedOutfits.length})</button>
      </div>
      {tab==='items'&&(<>
        <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:16}}>
          {FILTERS.map(([v,l])=><span key={v} className={`tag${filter===v?' sel-coral':''}`} onClick={()=>setFilter(v)}>{l}</span>)}
        </div>
        {/* Drag & Drop hint — always visible when on items tab */}
        {filter==='all'&&(
          <div style={{display:'flex',alignItems:'center',gap:10,background:'linear-gradient(135deg,rgba(30,111,181,0.06),rgba(29,143,114,0.06))',border:'1.5px dashed rgba(30,111,181,0.3)',borderRadius:11,padding:'10px 16px',marginBottom:14,cursor:'pointer'}} onClick={()=>setShowAdd(true)}>
            <span style={{fontSize:'1.4rem'}}>📸</span>
            <div style={{flex:1}}>
              <div style={{fontSize:'0.8rem',fontWeight:700,color:'var(--sky)'}}>Drag photos here — one or many at once</div>
              <div style={{fontSize:'0.72rem',color:'var(--text3)',marginTop:2}}>Bulk upload supported · name, type & color auto-suggested · tap any card to edit details</div>
            </div>
            <button className="btn btn-sky btn-sm" style={{flexShrink:0}}>+ Add Item</button>
          </div>
        )}
        {filtered.length===0?(
          <div className="empty">
            <div className="empty-icon">👗</div><div className="empty-title">No items yet</div>
            <div className="empty-sub">Add your clothes with photos to get outfit suggestions and a smart packing list.</div>
            <button className="btn btn-sky" onClick={()=>setShowAdd(true)}>+ Add First Item</button>
          </div>
        ):(
          <div className="item-grid">
            {filtered.map(item=>(
              <div key={item.id} className="item-card" onClick={()=>setEditItem(item)}>
                <div className="item-thumb"><div className="item-swatch" style={{background:item.bg||'var(--bg4)',width:'100%',height:'100%'}}>{item.photo?<img src={item.photo} alt={item.name} style={{width:'100%',height:'100%',objectFit:'cover'}}/>:<span className="item-emoji">{typeEmoji(item.type)}</span>}</div></div>
                <div className="item-info"><div className="item-name">{item.name}</div><div className="item-sub">{item.color||ITEM_TYPES.find(t=>t.value===item.type)?.label}</div></div>
              </div>
            ))}
          </div>
        )}
      </>)}
      {tab==='sets'&&(<>
        {savedOutfits.length===0?(
          <div className="empty"><div className="empty-icon">🧩</div><div className="empty-title">No outfit sets</div><div className="empty-sub">Combine items into named looks — use them as anchor outfits when planning trips.</div><button className="btn btn-sky" onClick={()=>setShowAddSet(true)}>+ Create First Set</button></div>
        ):(
          <div className="outfit-grid">
            {savedOutfits.map(set=>{
              const items=set.itemIds.map(id=>wardrobe.find(i=>i.id===id)).filter(Boolean);
              return (
                <div key={set.id} className="outfit-card" style={{cursor:'pointer'}} onClick={()=>setEditSet(set)}>
                  <div className="outfit-photos">
                    {items.slice(0,4).map(item=>(
                      <div key={item.id} className="outfit-photo"><div className="outfit-swatch" style={{background:item.bg||'var(--bg4)',width:'100%',height:'100%'}}>{item.photo?<img src={item.photo} alt={item.name} style={{width:'100%',height:'100%',objectFit:'cover'}}/>:<span className="outfit-emoji">{typeEmoji(item.type)}</span>}</div></div>
                    ))}
                    {!items.length&&<div className="outfit-photo"><span className="outfit-emoji">🧩</span></div>}
                  </div>
                  <div className="outfit-body"><div className="outfit-name">{set.name}</div><div className="outfit-pieces">{items.map(i=><span key={i.id} className="piece-tag">{i.name}</span>)}</div></div>
                </div>
              );
            })}
          </div>
        )}
      </>)}
      {(showAdd||editItem)&&<ItemModal item={editItem} onSave={saveItem} onDelete={delItem} onClose={()=>{setEditItem(null);setShowAdd(false);}}/>}
      {(showAddSet||editSet)&&<SetModal set={editSet} wardrobe={wardrobe} onSave={saveSet} onDelete={delSet} onClose={()=>{setEditSet(null);setShowAddSet(false);}}/>}
    </div>
  );
}

// ─── Inspiration View ─────────────────────────────────────────────────────────
function InspoView({ board, setBoard }) {
  const [tagImg,setTagImg]=useState(null);
  const add=useCallback(async(src,file)=>{
    // Analyze colors → auto-suggest aesthetics
    const analysis=await analyzePhoto(src,file?.name||'');
    const newImg={id:uid(),photo:src,aesthetics:[],suggestions:analysis.aesthetics||[]};
    setBoard(b=>[...b,newImg]);
    // Auto-open tag sheet so user can confirm/edit suggestions
    setTagImg(newImg);
  },[setBoard]);
  const saveTag=img=>{setBoard(b=>b.map(i=>i.id===img.id?{...img,suggestions:undefined}:i));setTagImg(null);};
  const remove=id=>{setBoard(b=>b.filter(i=>i.id!==id));if(tagImg?.id===id)setTagImg(null);};
  const dna=calcDNA(board);
  return (
    <div className="page">
      <div className="mb-24"><h2 style={{fontSize:'1.5rem'}}>Inspiration Board</h2><p className="text-sm mt-8">Upload Pinterest screenshots or style photos — we'll decode your aesthetic DNA</p></div>
      <DZ height={130} hint="Drag & drop your inspiration images here, or click to browse" multi onFile={add}/>
      {board.length>0&&(<>
        <div className="flex-between mt-24 mb-12"><h3 style={{fontSize:'1rem',fontWeight:700}}>Your Board <span style={{color:'var(--text3)',fontFamily:'Inter',fontWeight:400}}> ({board.length} images)</span></h3><span className="text-xs">Click any image to tag its vibe</span></div>
        <div className="inspo-grid">
          {board.map(img=>(
            <div key={img.id} className={`inspo-card${img.aesthetics.length?' tagged':''}`} onClick={()=>setTagImg(img)}>
              <img src={img.photo} alt=""/>
              <div className="inspo-overlay">{img.aesthetics.length?<div className="inspo-vibe-tags">{img.aesthetics.map(a=>{const ae=AESTHETICS.find(x=>x.value===a);return<span key={a} className="inspo-vibe">{ae?.emoji} {ae?.label||a}</span>;})}</div>:<span style={{fontSize:'0.75rem',color:'rgba(255,255,255,.9)',fontWeight:600,background:'rgba(0,0,0,0.3)',padding:'3px 8px',borderRadius:10}}>✏️ Tag vibe</span>}</div>
              <button style={{position:'absolute',top:6,right:6,background:'rgba(28,24,40,0.55)',border:'none',color:'#fff',borderRadius:'50%',width:22,height:22,cursor:'pointer',fontSize:'0.7rem',display:'flex',alignItems:'center',justifyContent:'center'}} onClick={e=>{e.stopPropagation();remove(img.id);}}>✕</button>
            </div>
          ))}
        </div>
        {dna&&(
          <div className="card mt-24">
            <div className="flex-between mb-16"><h3 style={{fontSize:'1.1rem'}}>✨ Your Style DNA</h3><span className="badge badge-sky">{board.filter(i=>i.aesthetics.length).length} tagged</span></div>
            <p className="text-sm mb-16">Based on your inspiration board, you lean toward:</p>
            {AESTHETICS.map(a=><div key={a.value} className="dna-bar"><span className="dna-lbl">{a.emoji} {a.label}</span><div className="dna-track"><div className="dna-fill" style={{width:`${dna[a.value]||0}%`}}/></div><span className="dna-pct">{dna[a.value]||0}%</span></div>)}
            <p className="text-xs mt-8" style={{color:'var(--lavender)'}}>Use "Apply from Board" in Trip Setup → Step 2 to auto-fill your style sliders.</p>
          </div>
        )}
      </>)}
      {!board.length&&<div className="empty mt-24"><div className="empty-icon">🖼️</div><div className="empty-title">Build your style board</div><div className="empty-sub">Drop in Pinterest screenshots, fashion blog photos, or any looks you love. We'll extract your aesthetic profile.</div></div>}
      {tagImg&&<InspoTagSheet img={tagImg} onSave={saveTag} onClose={()=>setTagImg(null)}/>}
    </div>
  );
}

// ─── Trip Setup View ──────────────────────────────────────────────────────────
function TripSetup({ wardrobe, savedOutfits, board, onTrip, onBack, initialTrip }) {
  const [step,setStep]=useState(1);
  const [loading,setLoading]=useState(false);
  const [wErr,setWErr]=useState(null);
  const defAes=()=>Object.fromEntries(AESTHETICS.map(a=>[a.value,0]));
  // Pre-fill form from initialTrip (when editing an existing trip) or start fresh
  const [form,setForm]=useState(()=>{
    if(!initialTrip) return {dest:'',start:'',end:'',luggage:['carry-on'],vtype:'mixed',acts:[],aes:defAes(),hi:[],hs:[],weather:null,dnaApplied:false};
    const lug=initialTrip.luggage;
    const lugArr=Array.isArray(lug)?lug:(lug?[lug]:['carry-on']);
    return {dest:initialTrip.dest||'',start:initialTrip.startDate||'',end:initialTrip.endDate||'',luggage:lugArr,vtype:initialTrip.vacationType||'mixed',acts:initialTrip.activities||[],aes:initialTrip.aesthetics||defAes(),hi:initialTrip.heroItems||[],hs:[],weather:initialTrip.weather||null,dnaApplied:initialTrip.dnaApplied||false};
  });
  const s=v=>setForm(f=>({...f,...v}));
  const days=useMemo(()=>{if(!form.start||!form.end)return 0;return Math.max(1,Math.round((new Date(form.end)-new Date(form.start))/86400000)+1);},[form.start,form.end]);
  const togAct=a=>s({acts:form.acts.includes(a)?form.acts.filter(x=>x!==a):[...form.acts,a]});
  const togHI=id=>s({hi:form.hi.includes(id)?form.hi.filter(x=>x!==id):[...form.hi,id]});
  const togHS=id=>s({hs:form.hs.includes(id)?form.hs.filter(x=>x!==id):[...form.hs,id]});
  const fetchW=useCallback(async()=>{if(!form.dest.trim()||!form.start||!days)return;setLoading(true);setWErr(null);try{s({weather:await getWeather(form.dest,form.start,days)});}catch(e){setWErr(e.message);}finally{setLoading(false);}},[form.dest,form.start,form.end,days]);
  // Auto-fetch weather 800ms after dest+dates are all filled
  useEffect(()=>{
    if(!form.dest.trim()||!form.start||!form.end||days<=0)return;
    s({weather:null});setWErr(null);
    const t=setTimeout(fetchW,800);
    return()=>clearTimeout(t);
  },[form.dest,form.start,form.end,days]);
  const snap5=v=>Math.round(v/5)*5;
  const applyDNA=()=>{
    if(form.dnaApplied){s({aes:defAes(),dnaApplied:false});return;}
    const dna=calcDNA(board);if(!dna)return;
    // Round all values to nearest 5
    const snapped=Object.fromEntries(Object.entries(dna).map(([k,v])=>[k,snap5(v)]));
    s({aes:snapped,dnaApplied:true});
  };
  const ok1=form.dest.trim()&&form.start&&form.end&&days>0;
  const ok2=form.vtype&&form.acts.length>0;
  const STEPS=[{n:1,l:'Trip Details'},{n:2,l:'Style & Activities'},{n:3,l:'Anchor Pieces'}];
  return (
    <div className="page">
      <div className="flex-between mb-24">
        <h2 style={{fontSize:'1.5rem'}}>Plan a Trip</h2>
        <button className="btn btn-ghost btn-sm" onClick={step>1?()=>setStep(p=>p-1):onBack}>← Back</button>
      </div>
      <div className="wiz-row">
        {STEPS.map((ws,i)=>(<React.Fragment key={ws.n}>
          {i>0&&<div className={`wiz-line${step>ws.n-1?' done':''}`}/>}
          <div className="wiz-step-wrap"><div className={`wiz-dot${step>ws.n?' done':step===ws.n?' active':''}`}>{step>ws.n?'✓':ws.n}</div><div className={`wiz-lbl${step===ws.n?' active':step>ws.n?' done':''}`}>{ws.l}</div></div>
        </React.Fragment>))}
      </div>

      {step===1&&(
        <div>
          <div className="form-group"><label>Where are you going? *</label><input value={form.dest} onChange={e=>s({dest:e.target.value})} placeholder="e.g. Tulum, Mexico" style={{fontSize:'1rem',padding:'12px 14px'}}/></div>
          <div className="form-row"><div className="form-group"><label>Departure *</label><input type="date" value={form.start} onChange={e=>s({start:e.target.value})}/></div><div className="form-group"><label>Return *</label><input type="date" value={form.end} min={form.start} onChange={e=>s({end:e.target.value})}/></div></div>
          {days>0&&<p className="text-sm mb-16">📅 {days} night{days!==1?'s':''}</p>}
          <div className="form-group">
            <label>Luggage (select all you're bringing)</label>
            <div className="tag-wrap mt-8">
              {LUGGAGE.filter(l=>l.value!=='both').map(l=>{
                const sel=form.luggage.includes(l.value);
                return(
                  <span key={l.value} className={`tag${sel?' sel':''}`} style={{fontSize:'0.85rem',padding:'7px 16px'}}
                    onClick={()=>{const curr=form.luggage;const upd=sel?curr.filter(x=>x!==l.value):[...curr,l.value];s({luggage:upd.length>0?upd:['carry-on']});}}>
                    {l.label} <span style={{fontSize:'0.7rem',opacity:0.65}}>({l.note})</span>
                  </span>
                );
              })}
            </div>
          </div>
          <div className="card mt-16">
            <div className="flex-between mb-12"><span style={{fontWeight:700,fontSize:'0.9rem'}}>🌤 Weather Forecast</span>{loading&&<span className="text-xs" style={{color:'var(--sky)'}}>Fetching…</span>}{!loading&&form.weather&&<span className="text-xs" style={{color:'var(--mint)'}}>✓ Auto-fetched</span>}{!loading&&!form.weather&&ok1&&!wErr&&<span className="text-xs" style={{color:'var(--text3)'}}>Auto-fetching…</span>}</div>
            {wErr&&<p style={{color:'var(--red)',fontSize:'0.8rem',marginBottom:8}}>⚠️ {wErr} <button className="btn btn-ghost btn-xs" onClick={fetchW}>Retry</button></p>}
            {!form.weather&&!wErr&&!loading&&<p className="text-xs">Fill in destination and dates — weather loads automatically.</p>}
            {loading&&<p className="text-xs" style={{color:'var(--sky)'}}>Looking up forecast for {form.dest}…</p>}
            {form.weather&&(
              <div className="weather-card mt-8">
                <div className="wc-icon">{wmoIcon(form.weather.conditions)}</div>
                <div><div className="wc-temp">{form.weather.min}°–{form.weather.max}°C</div><div className="wc-desc">{form.weather.conditions} · {form.weather.location}</div>{!form.weather.isForecast&&<div className="wc-note">📊 Historical estimate (same dates last year)</div>}</div>
              </div>
            )}
          </div>
          <div style={{textAlign:'right',marginTop:24}}><button className="btn btn-sky" disabled={!ok1} onClick={()=>setStep(2)}>Next: Style & Activities →</button></div>
        </div>
      )}

      {step===2&&(
        <div>
          <p style={{fontSize:'0.9rem',fontWeight:500,color:'var(--text)',background:'var(--bg2)',borderRadius:10,padding:'12px 16px',borderLeft:'3px solid var(--coral)',marginBottom:20,boxShadow:'var(--shadow-sm)'}}>
            Pick your trip vibe and activities — we'll use these to match outfits and build your essentials list.
          </p>
          <div className="form-group"><label>Trip Vibe</label><div className="tag-wrap mt-8">{VACATION_TYPES.map(v=><span key={v.value} className={`tag${form.vtype===v.value?' sel-coral':''}`} style={{fontSize:'0.85rem',padding:'7px 16px'}} onClick={()=>s({vtype:v.value})}>{v.label}</span>)}</div></div>
          <div className="form-group mt-16"><label>Activities (select all that apply)</label><div className="tag-wrap mt-8">{ACTIVITIES.map(a=><span key={a.value} className={`tag${form.acts.includes(a.value)?' sel':''}`} onClick={()=>togAct(a.value)}>{a.label}</span>)}</div></div>
          <hr className="divider"/>
          <div className="flex-between mb-12">
            <label style={{margin:0,color:'var(--text)',fontWeight:700}}>Style Mix</label>
            <div style={{display:'flex',gap:8}}>
              {board.length>0&&<button className="btn btn-outline btn-sm" onClick={applyDNA}>✨ Apply from Board</button>}
              <button className="btn btn-sm" style={{background:'rgba(201,83,58,0.1)',border:'1px solid rgba(201,83,58,0.3)',color:'var(--coral)'}} onClick={()=>s({aes:defAes(),dnaApplied:false})}>↺ Reset</button>
            </div>
          </div>
          {form.dnaApplied&&<p style={{fontSize:'0.82rem',color:'var(--lavender)',fontWeight:600,marginBottom:12}}>✨ Sliders filled from your inspiration board — rounded to nearest 5.</p>}
          {AESTHETICS.map(a=>(
            <div key={a.value} className="slider-row">
              <div className="slider-lbl">
                <span className="slider-lbl-left">{a.emoji} {a.label}</span>
                <input type="number" min={0} max={100} step={5}
                  value={form.aes[a.value]}
                  onChange={e=>{const v=Math.min(100,Math.max(0,snap5(+e.target.value||0)));s({aes:{...form.aes,[a.value]:v}});}}
                  style={{width:52,padding:'2px 6px',fontSize:'0.8rem',fontWeight:700,color:'var(--sky)',textAlign:'center',border:'1.5px solid var(--border)',borderRadius:6,height:28}}/>
              </div>
              <input type="range" min={0} max={100} step={5} value={form.aes[a.value]} onChange={e=>s({aes:{...form.aes,[a.value]:+e.target.value}})}/>
            </div>
          ))}
          {/* Style Mix Total Indicator */}
          {(()=>{
            const total=Object.values(form.aes).reduce((a,b)=>a+b,0);
            const over=total>100; const done=total===100;
            return(
              <div style={{marginTop:16,marginBottom:4,padding:'12px 16px',borderRadius:11,background:done?'rgba(29,143,114,0.08)':over?'rgba(201,83,58,0.08)':'rgba(26,22,36,0.05)',border:`1.5px solid ${done?'rgba(29,143,114,0.3)':over?'rgba(201,83,58,0.35)':'var(--border)'}`}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
                  <span style={{fontSize:'0.78rem',fontWeight:700,color:done?'var(--mint)':over?'var(--coral)':'var(--text2)'}}>
                    {done?'✓ Style mix complete':over?`⚠ Over by ${total-100}% — reduce some sliders`:`${100-total}% remaining to allocate`}
                  </span>
                  <span style={{fontSize:'1rem',fontWeight:800,color:done?'var(--mint)':over?'var(--coral)':'var(--sky)'}}>{total}%</span>
                </div>
                <div style={{height:7,background:'var(--bg4)',borderRadius:4,overflow:'hidden'}}>
                  <div style={{height:'100%',width:`${Math.min(total,100)}%`,borderRadius:4,background:done?'linear-gradient(90deg,var(--mint),var(--sky))':over?'var(--coral)':'linear-gradient(90deg,var(--sky),var(--lavender))',transition:'width .3s ease'}}/>
                </div>
              </div>
            );
          })()}
          <div style={{textAlign:'right',marginTop:24}}><button className="btn btn-sky" disabled={!ok2} onClick={()=>setStep(3)}>Next: Anchor Pieces →</button></div>
        </div>
      )}

      {step===3&&(
        <div>
          {/* Outfit count recommendation + hero pieces — unified card */}
          {(()=>{
            const {min,max}=calcOutfitRange(days,form.luggage,form.weather);
            const luggageArr=Array.isArray(form.luggage)?form.luggage:[form.luggage];
            const luggageLabel=luggageArr.map(l=>({personal:'personal item','carry-on':'carry-on',checked:'checked bag',both:'carry-on + personal item'}[l]||l)).join(' + ');
            return(
              <div style={{background:'linear-gradient(135deg,rgba(30,111,181,0.07),rgba(29,143,114,0.07))',border:'1.5px solid rgba(30,111,181,0.2)',borderRadius:12,padding:'18px 20px',marginBottom:20,boxShadow:'var(--shadow-sm)'}}>
                <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:8}}>
                  <span style={{fontSize:'1.4rem'}}>🎯</span>
                  <span style={{fontWeight:700,fontSize:'0.95rem',color:'var(--sky)'}}>Outfit recommendation for this trip</span>
                </div>
                <div style={{fontSize:'0.88rem',color:'var(--text)',marginBottom:8}}>
                  Based on <strong>{days} night{days!==1?'s':''}</strong>{form.weather?<>, <strong>{form.weather.min}–{form.weather.max}°C</strong> weather</>:null} and <strong>{luggageLabel}</strong>:
                </div>
                <div style={{display:'flex',alignItems:'baseline',gap:6,marginBottom:6}}>
                  <span style={{fontSize:'1.8rem',fontWeight:800,color:'var(--sky)',lineHeight:1}}>{min}–{max}</span>
                  <span style={{fontSize:'0.88rem',color:'var(--text2)'}}>outfits recommended</span>
                </div>
                <div style={{fontSize:'0.76rem',color:'var(--text3)',marginBottom:14}}>You'll choose which ones to pack in the next step. Aim for the middle of this range.</div>
                <div style={{borderTop:'1px solid rgba(30,111,181,0.15)',paddingTop:12,fontSize:'0.88rem',fontWeight:500,color:'var(--text)',borderLeft:'3px solid var(--sky)',paddingLeft:12,background:'rgba(30,111,181,0.04)',borderRadius:'0 8px 8px 0'}}>
                  <strong>Optional:</strong> Pin your must-pack hero pieces below — they'll appear first in your packing list and be prioritized in outfit combos.
                </div>
              </div>
            );
          })()}
          {wardrobe.length>0&&(<>
            <label style={{marginBottom:10,color:'var(--text)',fontWeight:700,fontSize:'0.85rem'}}>Tap items to pin as must-haves</label>
            <div className="item-grid mt-8">
              {wardrobe.map(item=>{const isH=form.hi.includes(item.id);return(
                <div key={item.id} className={`item-card${isH?' hero':''}`} onClick={()=>togHI(item.id)}>
                  <div className="item-thumb"><div className="item-swatch" style={{background:item.bg||'var(--bg4)',width:'100%',height:'100%'}}>{item.photo?<img src={item.photo} alt={item.name} style={{width:'100%',height:'100%',objectFit:'cover'}}/>:<span className="item-emoji">{typeEmoji(item.type)}</span>}</div></div>
                  <div className="item-info"><div className="item-name">{item.name}</div></div>
                  {isH&&<div className="item-pin item-pin-hero">⭐</div>}
                </div>
              );})}
            </div>
          </>)}
          {!wardrobe.length&&<div className="card" style={{textAlign:'center',padding:28,color:'var(--text2)',fontSize:'0.88rem'}}>Add items to your closet first to pin hero pieces.</div>}
          <div style={{textAlign:'right',marginTop:28}}>
            <button className="btn btn-coral" style={{fontSize:'1rem',padding:'12px 28px'}} onClick={()=>onTrip({dest:form.dest,startDate:form.start,endDate:form.end,days,luggage:Array.isArray(form.luggage)?form.luggage:[form.luggage],vacationType:form.vtype,activities:form.acts,aesthetics:form.aes,heroItems:form.hi,weather:form.weather,dnaApplied:form.dnaApplied,id:uid()})}>
              🧳 Generate My Packing List
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

// ─── Packing List View ────────────────────────────────────────────────────────
function PackingView({ trip, wardrobe, savedOutfits, board, initChecked, onSave, onBack, onGoTrips, onEditTrip }) {
  const [tab,setTab]=useState('outfits');
  const [checked,setChecked]=useState(initChecked||new Set());
  const [justSaved,setJustSaved]=useState(false);
  const [selectedOutfits,setSelectedOutfits]=useState(new Set());
  const [showSticky,setShowSticky]=useState(false);
  const tripHeaderRef=useRef();

  useEffect(()=>{
    const el=document.querySelector('.app-content');
    if(!el)return;
    const check=()=>{if(!tripHeaderRef.current)return;const r=tripHeaderRef.current.getBoundingClientRect();setShowSticky(r.bottom<58);};
    el.addEventListener('scroll',check,{passive:true});
    return()=>el.removeEventListener('scroll',check);
  },[]);

  const outfits=useMemo(()=>buildOutfits(wardrobe,trip,trip.weather),[wardrobe,trip]);
  const essentials=useMemo(()=>buildEssentials(trip,trip.weather),[trip]);

  // Outfit selection helpers
  const togOutfit=id=>setSelectedOutfits(s=>{const n=new Set(s);n.has(id)?n.delete(id):n.add(id);return n;});
  const allOutfitsSelected=outfits.length>0&&outfits.every(o=>selectedOutfits.has(o.id));
  const toggleAllOutfits=()=>{ if(allOutfitsSelected){setSelectedOutfits(new Set());}else{setSelectedOutfits(new Set(outfits.map(o=>o.id)));} };

  // Derive pack items from selected outfits — deduplicated by item id
  const packItems=useMemo(()=>{
    const map=new Map();
    outfits.filter(o=>selectedOutfits.has(o.id)).forEach(o=>o.items.forEach(item=>{if(!map.has(item.id))map.set(item.id,item);}));
    // Always include pinned hero items even if not in a selected outfit
    (trip.heroItems||[]).forEach(id=>{if(!map.has(id)){const item=wardrobe.find(i=>i.id===id);if(item)map.set(id,item);}});
    return [...map.values()];
  },[outfits,selectedOutfits,trip.heroItems,wardrobe]);

  // Checklist helpers
  const tog=id=>setChecked(s=>{const n=new Set(s);n.has(id)?n.delete(id):n.add(id);return n;});
  const togAll=ids=>setChecked(s=>{const n=new Set(s);ids.every(id=>n.has(id))?ids.forEach(id=>n.delete(id)):ids.forEach(id=>n.add(id));return n;});

  // Progress across clothes + essentials
  const essIds=essentials.flatMap(c=>c.items.map(i=>`ess-${i}`));
  const total=packItems.length+essIds.length;
  const done=packItems.filter(i=>checked.has(i.id)).length+essIds.filter(id=>checked.has(id)).length;
  const pct=total>0?Math.round(done/total*100):0;

  const handleSave=()=>{onSave(trip,[...checked]);setJustSaved(true);setTimeout(()=>setJustSaved(false),3000);};

  // Outfit count recommendation for this trip
  const {min:outMin,max:outMax}=calcOutfitRange(trip.days,trip.luggage,trip.weather);

  // Tab labels — show ✓ when fully checked
  const allPackDone=packItems.length>0&&packItems.every(i=>checked.has(i.id));
  const allEssDone=essIds.length>0&&essIds.every(id=>checked.has(id));
  const clothesLabel=`🧺 My Pack${packItems.length>0?` (${packItems.length})`:''}${allPackDone?' ✓':''}`;
  const essLabel=`🎒 Essentials${essIds.length>0?` (${essIds.length})`:''}${allEssDone?' ✓':''}`;
  const outfitsLabel=`👗 Outfits${outfits.length>0?` (${outfits.length})`:''}${selectedOutfits.size>0?` · ${selectedOutfits.size} ✓`:''}`;

  // Celebration: fire once when everything checked
  const [celebrated,setCelebrated]=useState(false);
  const [showCelebration,setShowCelebration]=useState(false);
  useEffect(()=>{
    if(pct===100&&total>0&&!celebrated){setCelebrated(true);setShowCelebration(true);}
  },[pct,total,celebrated]);

  return (
    <div>
      {/* Celebration modal */}
      {showCelebration&&(
        <div className="modal-bg" onClick={()=>setShowCelebration(false)}>
          <div className="modal" style={{textAlign:'center',maxWidth:460}} onClick={e=>e.stopPropagation()}>
            <div style={{fontSize:'3.2rem',marginBottom:10}}>🎉✈️</div>
            <h2 style={{fontSize:'1.7rem',fontWeight:800,fontFamily:'Playfair Display,serif',marginBottom:10,lineHeight:1.2,color:'var(--text)'}}>
              Congrats! You're packed and ready for your trip!
            </h2>
            <p style={{fontSize:'1.05rem',color:'var(--mint)',fontWeight:700,marginBottom:16,lineHeight:1.5}}>
              Every item checked, every look sorted. You did it — stress-free packing complete. 🌿
            </p>
            {/* Destination-specific eco + fee quote */}
            <div style={{background:'linear-gradient(135deg,rgba(29,143,114,0.08),rgba(201,83,58,0.06))',border:'1.5px solid rgba(29,143,114,0.2)',borderRadius:12,padding:'14px 16px',marginBottom:16,textAlign:'left'}}>
              <p style={{fontSize:'0.95rem',color:'var(--text)',fontStyle:'italic',lineHeight:1.65,marginBottom:0}}>
                {(()=>{
                  const d=(trip.dest||'').toLowerCase();
                  if(/pereira|armenia|manizales|eje cafetero|coffee|risaralda/i.test(d))
                    return `"${trip.dest}'s coffee highlands deserve light shoulders. Packing smart means no checked-bag fees — keep that money for a proper tinto and a mountain view. Less weight, less carbon, more Colombia. ☕🌿"`;
                  if(/cartagena|barranquilla|santa marta|colombia/i.test(d))
                    return `"${trip.dest} shines brightest when you travel light. Skip the bag fees, skip the baggage carousel, and put that money toward ceviche on the coast. Light packing = lower emissions. 🐟🌊"`;
                  if(/medellin|bogota/i.test(d))
                    return `"${trip.dest} rewards the light traveler — no bag fees, no waiting at the carousel, and a smaller carbon footprint. More money for the trip, less weight on the planet. 🌺"`;
                  if(/beach|cancun|tulum|bali|hawaii|miami|ibiza|maldives|phuket|cabo|playa|coast/i.test(d))
                    return `"The best souvenir from ${trip.dest} is the money you saved on bag fees. Packing light keeps emissions low and your wallet full for the real adventures. 🌊"`;
                  if(/paris|rome|london|barcelona|amsterdam|berlin|madrid|florence|venice|tokyo|seoul/i.test(d))
                    return `"${trip.dest} was made for light packers — no bag fees, smoother metros, smaller footprint. Every kilo you skip saves CO₂ and puts money back in your pocket. 🗺️"`;
                  if(/mountain|alps|aspen|whistler|banff|colorado|rockies/i.test(d))
                    return `"The mountains of ${trip.dest} don't need your extra baggage — and neither does the planet. Light pack = lower emissions, zero bag fees, and more for the après. 🏔️"`;
                  return `"Packing light for ${trip.dest||'your trip'} means no surprise bag fees at the gate — put that money toward something worth remembering. Fewer bags, lower CO₂ emissions, smaller carbon footprint. Better trip. 🌍"`;
                })()}
              </p>
            </div>
            {/* Session warning / save reminder */}
            <div style={{background:'rgba(30,111,181,0.07)',borderRadius:10,padding:'12px 14px',marginBottom:20,fontSize:'0.83rem',color:'var(--text2)',textAlign:'left',border:'1px solid rgba(30,111,181,0.18)',lineHeight:1.6}}>
              <strong style={{color:'var(--sky)'}}>💾 Save before you close —</strong> Data lives in this tab only. Download your trip file under the <strong>My Trips</strong> tab — upload it there anytime to pick right back up.
            </div>
            <div style={{display:'flex',gap:10,justifyContent:'center',flexWrap:'wrap'}}>
              <button className="btn btn-outline" onClick={()=>setShowCelebration(false)}>Keep Packing</button>
              <button className="btn btn-sky" onClick={()=>{handleSave();setShowCelebration(false);}}>💾 Save This Trip</button>
            </div>
          </div>
        </div>
      )}

      {/* Sticky Progress Bar */}
      {showSticky&&total>0&&(
        <div className="sticky-progress">
          <div className="sticky-progress-inner">
            <div className="prog-row">
              <span className="prog-label">🧳 {trip.dest} — {done} of {total} packed</span>
              <span className="prog-pct" style={{color:pct===100?'var(--green)':pct>=60?'var(--sky)':'var(--coral)'}}>{pct}%{pct===100?' 🎉':''}</span>
            </div>
            <div className="prog-bar"><div className="prog-fill" style={{width:`${pct}%`}}/></div>
          </div>
        </div>
      )}

      <div className="page">
        {/* Trip header */}
        <div className="flex-between mb-8" ref={tripHeaderRef}>
          <div>
            <h2 style={{fontSize:'1.4rem'}}>🧳 {trip.dest}</h2>
            <p className="text-sm mt-8">{fmtDate(trip.startDate)} – {fmtDate(trip.endDate)} · {trip.days} night{trip.days!==1?'s':''}</p>
          </div>
          <div style={{display:'flex',gap:8,alignItems:'center',flexShrink:0}}>
            {justSaved&&<span className="badge badge-green">✓ Saved!</span>}
            <button className="btn btn-outline btn-sm" onClick={onEditTrip||onBack}>← Edit Trip</button>
            <button className="btn btn-outline btn-sm" onClick={handleSave}>💾 Save</button>
            <button className="btn btn-ghost btn-sm" onClick={onBack}>← New Trip</button>
          </div>
        </div>

        {trip.weather&&(
          <div className="weather-card mb-16">
            <div className="wc-icon">{wmoIcon(trip.weather.conditions)}</div>
            <div><div className="wc-temp">{trip.weather.min}°–{trip.weather.max}°C</div><div className="wc-desc">{trip.weather.conditions} · {trip.weather.location}</div></div>
          </div>
        )}

        {/* Overall progress bar (always visible) */}
        {total>0&&(
          <div style={{marginBottom:20}}>
            <div className="prog-row" style={{marginBottom:6}}>
              <span style={{fontSize:'0.8rem',color:'var(--text2)',fontWeight:500}}>{done} of {total} items packed</span>
              <span style={{fontSize:'0.8rem',fontWeight:700,color:pct===100?'var(--green)':pct>=60?'var(--sky)':'var(--coral)'}}>{pct}%{pct===100?' 🎉':''}</span>
            </div>
            <div className="prog-bar" style={{height:8,borderRadius:6}}><div className="prog-fill" style={{width:`${pct}%`,borderRadius:6}}/></div>
          </div>
        )}

        <div className="tabs">
          <button className={`tab${tab==='outfits'?' active':''}`} onClick={()=>setTab('outfits')}>{outfitsLabel}</button>
          <button className={`tab${tab==='clothes'?' active':''}`} onClick={()=>setTab('clothes')}>{clothesLabel}</button>
          <button className={`tab${tab==='essentials'?' active':''}`} onClick={()=>setTab('essentials')}>{essLabel}</button>
        </div>

        {/* ── OUTFITS TAB ── */}
        {tab==='outfits'&&(
          <div>
            {outfits.length===0?(
              <div className="empty">
                <div className="empty-icon">👗</div>
                <div className="empty-title">Add tops, bottoms & shoes to your closet</div>
                <div className="empty-sub">Once you have clothing items, we'll generate outfit combinations ranked for your trip.</div>
              </div>
            ):(
              <>
                {/* Unified selection card: instruction + aim range + controls */}
                <div style={{background:'linear-gradient(135deg,rgba(201,83,58,0.06),rgba(30,111,181,0.05))',border:'1.5px solid rgba(201,83,58,0.18)',borderRadius:12,padding:'14px 16px',marginBottom:16}}>
                  <div className="flex-between mb-8">
                    <div>
                      <p style={{fontWeight:700,fontSize:'0.9rem',color:'var(--text)',marginBottom:3}}>
                        {selectedOutfits.size===0?'Tap outfits to select what you\'re packing':`${selectedOutfits.size} of ${outfits.length} outfit${outfits.length!==1?'s':''} selected`}
                      </p>
                      <p style={{fontSize:'0.82rem',color:'var(--coral)',fontWeight:600}}>
                        🎯 Aim for <strong>{outMin}–{outMax} outfits</strong> for your {trip.days}-day trip
                      </p>
                    </div>
                    <div style={{display:'flex',gap:8,flexShrink:0}}>
                      <button className="btn btn-outline btn-sm" onClick={onEditTrip||onBack}>← Edit Trip</button>
                      <button className="btn btn-outline btn-sm" onClick={toggleAllOutfits}>
                        {allOutfitsSelected?'Deselect All':'Select All'}
                      </button>
                    </div>
                  </div>
                </div>

                {/* Outfit grid — tap to select */}
                <div className="outfit-grid">
                  {outfits.map(o=>{
                    const isSel=selectedOutfits.has(o.id);
                    return(
                      <div key={o.id}
                        className={`outfit-card${o.hero?' hero':''}${isSel?' packed':''}`}
                        style={{cursor:'pointer',border:isSel?'2px solid var(--sky)':undefined,transition:'border .15s,box-shadow .15s',boxShadow:isSel?'0 0 0 3px rgba(41,128,196,0.15)':undefined}}
                        onClick={()=>togOutfit(o.id)}>
                        <div className="outfit-photos">
                          {o.items.slice(0,4).map(item=>(
                            <div key={item.id} className="outfit-photo">
                              <div className="outfit-swatch" style={{background:item.bg||'var(--bg4)',width:'100%',height:'100%'}}>
                                {item.photo?<img src={item.photo} alt={item.name} style={{width:'100%',height:'100%',objectFit:'cover'}}/>:<span className="outfit-emoji">{typeEmoji(item.type)}</span>}
                              </div>
                            </div>
                          ))}
                        </div>
                        <div className="outfit-body">
                          <div className="outfit-name">
                            {o.label}
                            {o.hero&&<span className="badge badge-sun" style={{marginLeft:4}}>⭐ Hero</span>}
                          </div>
                          <div className="outfit-score-row">
                            <div className="score-bar"><div className="score-fill" style={{width:`${o.pct}%`}}/></div>
                            <span className="score-pct">{o.pct}% match</span>
                          </div>
                          <div className="outfit-pieces">{o.items.map(i=><span key={i.id} className="piece-tag">{i.name}</span>)}</div>
                        </div>
                        <div className="outfit-footer">
                          <div style={{display:'flex',alignItems:'center',gap:8,width:'100%'}}>
                            <div style={{width:20,height:20,borderRadius:5,border:`2px solid ${isSel?'var(--sky)':'var(--border2)'}`,background:isSel?'var(--sky)':'transparent',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,transition:'all .15s'}}>
                              {isSel&&<span style={{color:'#fff',fontSize:'0.72rem',fontWeight:800,lineHeight:1}}>✓</span>}
                            </div>
                            <span style={{fontSize:'0.79rem',fontWeight:600,color:isSel?'var(--sky)':'var(--text3)'}}>
                              {isSel?'Selected to pack':'Tap to select'}
                            </span>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>

                {/* Sticky CTA */}
                {selectedOutfits.size>0&&(
                  <div style={{position:'sticky',bottom:24,display:'flex',justifyContent:'center',marginTop:28,zIndex:10}}>
                    <button
                      className="btn btn-sky"
                      style={{fontSize:'1rem',padding:'13px 32px',boxShadow:'0 4px 24px rgba(41,128,196,0.4)',borderRadius:14}}
                      onClick={()=>setTab('clothes')}>
                      👜 Build My Pack List ({selectedOutfits.size} outfit{selectedOutfits.size!==1?'s':''}) →
                    </button>
                  </div>
                )}
              </>
            )}
          </div>
        )}

        {/* ── MY PACK (CLOTHES) TAB ── */}
        {tab==='clothes'&&(
          <div>
            {packItems.length===0?(
              <div className="empty">
                <div className="empty-icon">👜</div>
                <div className="empty-title">No outfits selected yet</div>
                <div className="empty-sub">Go back to Outfits, tap the ones you're bringing, then come back here to see your full packing list.</div>
                <button className="btn btn-sky" style={{marginTop:16}} onClick={()=>setTab('outfits')}>← Choose Outfits</button>
              </div>
            ):(
              <>
                <div className="flex-between mb-12">
                  <div>
                    <p style={{fontWeight:700,fontSize:'0.9rem'}}>{packItems.filter(i=>checked.has(i.id)).length} of {packItems.length} items packed</p>
                  </div>
                  <div style={{display:'flex',gap:8}}>
                    <button className="btn btn-ghost btn-sm" onClick={()=>setTab('outfits')}>← Edit Outfits</button>
                    <button className="btn btn-ghost btn-sm" onClick={()=>togAll(packItems.map(i=>i.id))}>
                      {packItems.every(i=>checked.has(i.id))?'Uncheck All':'Check All'}
                    </button>
                  </div>
                </div>

                {/* Summary pill */}
                <div style={{display:'flex',alignItems:'center',gap:10,background:'rgba(41,128,196,0.07)',borderRadius:10,padding:'10px 14px',marginBottom:20,border:'1px solid rgba(41,128,196,0.15)'}}>
                  <span style={{fontSize:'1.3rem'}}>📦</span>
                  <span style={{fontSize:'0.82rem',color:'var(--text2)'}}>
                    <strong style={{color:'var(--sky)'}}>{packItems.length} unique item{packItems.length!==1?'s':''}</strong> across {selectedOutfits.size} outfit{selectedOutfits.size!==1?'s':''} — each item listed once, no matter how many looks it's in.
                  </span>
                </div>

                {/* Items by category */}
                {['top','bottom','dress','set','outerwear','shoes','swimwear','accessory','bag'].map(type=>{
                  const items=packItems.filter(i=>i.type===type);
                  if(!items.length)return null;
                  const ti=ITEM_TYPES.find(t=>t.value===type);
                  return(
                    <div key={type} className="pack-section">
                      <div className="sec-head">
                        <div className="sec-title">{ti?.emoji} {ti?.label}</div>
                        <div style={{display:'flex',gap:8,alignItems:'center'}}>
                          <span className="text-xs">{items.filter(i=>checked.has(i.id)).length}/{items.length}</span>
                          <button className="btn btn-ghost btn-xs" onClick={()=>togAll(items.map(i=>i.id))}>
                            {items.every(i=>checked.has(i.id))?'Uncheck':'Check all'}
                          </button>
                        </div>
                      </div>
                      {items.map(item=>(
                        <div key={item.id} className={`pack-item${checked.has(item.id)?' done':''}`} style={{cursor:'pointer'}} onClick={()=>tog(item.id)}>
                          <input type="checkbox" checked={checked.has(item.id)} onChange={()=>tog(item.id)} onClick={e=>e.stopPropagation()}/>
                          <div className="pi-thumb" style={{background:item.bg||'var(--bg4)'}}>
                            {item.photo?<img src={item.photo} alt={item.name}/>:<span style={{fontSize:'1.1rem'}}>{typeEmoji(item.type)}</span>}
                          </div>
                          <div style={{flex:1,minWidth:0}}>
                            <div className="pi-name">{item.name}</div>
                            {item.color&&<div className="pi-color">{item.color}</div>}
                          </div>
                          {trip.heroItems?.includes(item.id)&&<span className="badge badge-sun">⭐</span>}
                        </div>
                      ))}
                    </div>
                  );
                })}
              </>
            )}
          </div>
        )}

        {/* ── ESSENTIALS TAB ── */}
        {tab==='essentials'&&(
          <div>
            <p className="text-sm mb-20" style={{background:'rgba(53,184,154,0.08)',borderRadius:10,padding:'12px 14px',borderLeft:'3px solid var(--mint)'}}>
              Auto-generated based on your destination, weather, activities, and trip length.
            </p>
            {essentials.map(cat=>{
              const ids=cat.items.map(i=>`ess-${i}`);
              return(
                <div key={cat.cat} className="pack-section">
                  <div className="sec-head">
                    <div className="sec-title">{cat.cat}</div>
                    <div style={{display:'flex',gap:8,alignItems:'center'}}>
                      <span className="text-xs">{ids.filter(id=>checked.has(id)).length}/{ids.length}</span>
                      <button className="btn btn-ghost btn-xs" onClick={()=>togAll(ids)}>{ids.every(id=>checked.has(id))?'Uncheck':'Check all'}</button>
                    </div>
                  </div>
                  {cat.items.map(item=>{const id=`ess-${item}`;return(
                    <div key={item} className={`pack-item${checked.has(id)?' done':''}`} style={{cursor:'pointer'}} onClick={()=>tog(id)}>
                      <input type="checkbox" checked={checked.has(id)} onChange={()=>tog(id)} onClick={e=>e.stopPropagation()}/>
                      <span className="pi-name">{item}</span>
                    </div>
                  );})}
                </div>
              );
            })}
          </div>
        )}
      </div>

      {/* Bottom nav — always visible so users never need browser back */}
      <div style={{display:'flex',justifyContent:'center',gap:12,padding:'28px 20px 48px',borderTop:'1px solid var(--border)',marginTop:8}}>
        <button className="btn btn-outline btn-sm" onClick={onBack}>← Plan New Trip</button>
        <button className="btn btn-outline btn-sm" onClick={onGoTrips}>💾 My Trips</button>
      </div>
    </div>
  );
}

// ─── Saved Trips View ─────────────────────────────────────────────────────────
function TripsView({ trips, onLoad, onDelete, onExportAll, onImport, onExportTrip, downloadedTrips }) {
  return (
    <div className="page">
      <div className="flex-between mb-16">
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <h2 style={{fontSize:'1.5rem'}}>My Trips</h2>
          {trips.length>0&&<span className="badge badge-sky">{trips.length} saved</span>}
        </div>
        <div style={{display:'flex',gap:8}}>
          <button className="btn btn-outline btn-sm" onClick={onImport} title="Restore a previously downloaded backup">📤 Upload Backup</button>
          <button className="btn btn-sm" style={{background:'rgba(201,83,58,0.1)',border:'1px solid rgba(201,83,58,0.3)',color:'var(--coral)'}} onClick={onExportAll} title="Download all your trips, closet & inspo as a backup file">📥 Download All</button>
        </div>
      </div>
      <div style={{background:'rgba(30,111,181,0.06)',border:'1px solid rgba(30,111,181,0.15)',borderRadius:10,padding:'10px 14px',marginBottom:20,fontSize:'0.82rem',color:'var(--text2)'}}>
        💡 Your closet & trips live only in this browser tab. Download a backup before closing — you can restore it anytime.
      </div>
      {!trips.length?(
        <div className="empty"><div className="empty-icon">🗺️</div><div className="empty-title">No saved trips yet</div><div className="empty-sub">Plan a trip and tap "Save Trip" in the packing list to pick up where you left off anytime.</div></div>
      ):(
        trips.map(st=>{
          const vt=VACATION_TYPES.find(v=>v.value===st.trip.vacationType);
          const isDl=downloadedTrips&&downloadedTrips.has(st.id);
          return(
            <div key={st.id} className="trip-card" onClick={()=>onLoad(st)}>
              <div className="trip-icon">✈️</div>
              <div className="trip-meta">
                <div className="trip-dest">{st.destination||st.trip.dest}</div>
                <div className="trip-dates">{fmtDate(st.trip.startDate)} – {fmtDate(st.trip.endDate)} · {st.trip.days} nights</div>
                <div className="trip-prog">{st.checkedItems.length} items checked · {new Date(st.updatedAt).toLocaleDateString()}</div>
              </div>
              <div style={{display:'flex',gap:7,alignItems:'center',flexWrap:'wrap',justifyContent:'flex-end'}}>
                {isDl?(
                  <span style={{fontSize:'0.75rem',color:'var(--text3)',display:'flex',alignItems:'center',gap:4,textDecoration:'line-through',opacity:0.6}}>
                    <span>📥</span> Downloaded
                  </span>
                ):(
                  <button className="btn btn-outline btn-sm" onClick={e=>{e.stopPropagation();onExportTrip(st);}} title="Download this trip as a backup">📥</button>
                )}
                <button className="btn btn-sky btn-sm" onClick={e=>{e.stopPropagation();onLoad(st);}}>Resume →</button>
                <button className="btn btn-danger btn-sm" onClick={e=>{e.stopPropagation();onDelete(st.id);}}>🗑</button>
              </div>
            </div>
          );
        })
      )}
    </div>
  );
}

// ─── Welcome Screen ───────────────────────────────────────────────────────────
function Welcome({ onDemo, onOwn, isDemo, onClearDemo }) {
  return (
    <div className="welcome">
      <div className="welcome-hero">
        <div className="welcome-brand-mark">
          <div className="welcome-brand-icon">🧳</div>
          <span className="welcome-brand-name">Packed.</span>
        </div>
        <h1 className="welcome-title">Pack smart, skip the bag fees —<br/><span>save it for the next trip 🌍</span></h1>
        <p className="welcome-sub">Catalog your wardrobe, plan outfits by weather and activities, and generate a complete packing list — in minutes.</p>
        <div className="onboard-paths">

          {/* Path A: Demo */}
          <div className="path-card path-card-demo" onClick={onDemo}>
            <div className="path-icon">🎭</div>
            <div className="path-title">Try the Demo</div>
            <div className="path-desc">Explore Packed with a pre-loaded wardrobe of 10 real clothing photos. No setup required — just play.</div>
            <div className="path-steps">
              <div className="path-step"><div className="path-step-dot demo-dot">1</div>Sample wardrobe loaded instantly</div>
              <div className="path-step"><div className="path-step-dot demo-dot">2</div>Plan a demo trip (e.g. Tulum)</div>
              <div className="path-step"><div className="path-step-dot demo-dot">3</div>See outfits + packing list in action</div>
            </div>
            <button className="btn btn-coral path-cta" style={{pointerEvents:'none'}}>Explore Demo →</button>
          </div>

          {/* Path B: Own clothes */}
          <div className="path-card path-card-own" onClick={onOwn}>
            <div className="path-icon">👗</div>
            <div className="path-title">Use My Own Clothes</div>
            <div className="path-desc">Add your real wardrobe by dropping in photos — then plan any trip with personalized outfit suggestions.</div>
            <div className="path-steps">
              <div className="path-step"><div className="path-step-dot own-dot">1</div>Drop clothing photos into My Closet</div>
              <div className="path-step"><div className="path-step-dot own-dot">2</div>Add inspiration images (optional)</div>
              <div className="path-step"><div className="path-step-dot own-dot">3</div>Plan your trip → get your list</div>
            </div>
            <button className="btn btn-sky path-cta" style={{pointerEvents:'none'}}>Start My Closet →</button>
          </div>

        </div>
      </div>
      <div className="welcome-bottom">
        <div className="welcome-features">
          {[['🌤','Live Weather','Real forecast data for your destination'],['✨','Outfit Combos','AI-ranked looks tailored to your trip'],['💾','Save & Resume','Pick up packing anytime'],['📱','Works Offline','All data stays in your browser']].map(([icon,t,d])=>(
            <div key={t} className="feat"><div className="feat-icon">{icon}</div><div className="feat-title">{t}</div><div className="feat-desc">{d}</div></div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ─── App ──────────────────────────────────────────────────────────────────────
function App() {
  const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||'null')||d;}catch{return d;}};
  const [wardrobe,setWardrobe]=useState(()=>load('packed_wardrobe',[]));
  const [savedOutfits,setSavedOutfits]=useState(()=>load('packed_sets',[]));
  const [board,setBoard]=useState(()=>load('packed_inspo',[]));
  const [trips,setTrips]=useState(()=>load('packed_trips',[]));
  const [curTrip,setCurTrip]=useState(null);
  const [curChecked,setCurChecked]=useState(null);
  const [nav,setNav]=useState('welcome');
  const [isDemo,setIsDemo]=useState(false);

  useEffect(()=>{localStorage.setItem('packed_wardrobe',JSON.stringify(wardrobe));},[wardrobe]);
  useEffect(()=>{localStorage.setItem('packed_sets',JSON.stringify(savedOutfits));},[savedOutfits]);
  useEffect(()=>{localStorage.setItem('packed_inspo',JSON.stringify(board));},[board]);
  useEffect(()=>{localStorage.setItem('packed_trips',JSON.stringify(trips));},[trips]);

  const startDemo=()=>{setWardrobe(DEMO_WARDROBE);setSavedOutfits(DEMO_SETS);setIsDemo(true);setNav('closet');};
  const clearDemo=()=>{setWardrobe([]);setSavedOutfits([]);setIsDemo(false);setNav('welcome');};
  const startOwn=()=>{setIsDemo(false);setNav('closet');};

  // ── Export / Import ──
  const exportData=()=>{
    const blob=new Blob([JSON.stringify({wardrobe,savedOutfits,board,trips,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download=`packed-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();
    URL.revokeObjectURL(a.href);
  };
  const importData=()=>{
    const input=document.createElement('input');input.type='file';input.accept='.json,application/json';
    input.onchange=e=>{
      const file=e.target.files[0];if(!file)return;
      const reader=new FileReader();
      reader.onload=ev=>{
        try{
          const d=JSON.parse(ev.target.result);
          if(d.wardrobe)setWardrobe(d.wardrobe);
          if(d.savedOutfits)setSavedOutfits(d.savedOutfits);
          if(d.board)setBoard(d.board);
          if(d.trips)setTrips(d.trips);
          alert(`✅ Restored: ${d.wardrobe?.length||0} items, ${d.trips?.length||0} trips`);
        }catch{alert('❌ Invalid backup file — please use a Packed. JSON export.');}
      };reader.readAsText(file);
    };input.click();
  };

  const [downloadedTrips,setDownloadedTrips]=useState(new Set());

  const exportTripData=useCallback(st=>{
    const blob=new Blob([JSON.stringify({...st,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download=`packed-${(st.destination||st.trip.dest).replace(/\s+/g,'-').toLowerCase()}-${new Date().toISOString().slice(0,10)}.json`;
    a.click();URL.revokeObjectURL(a.href);
    setDownloadedTrips(prev=>new Set([...prev,st.id]));
  },[]);

  const [editTrip,setEditTrip]=useState(null);

  const handleTrip=trip=>{setCurTrip(trip);setCurChecked(null);setEditTrip(null);setNav('packing');};
  const handleSaveTrip=(trip,arr)=>{const rec={id:trip.id,destination:trip.dest,trip,checkedItems:arr,updatedAt:new Date().toISOString()};setTrips(p=>[rec,...p.filter(t=>t.id!==trip.id)]);};
  const handleLoadTrip=st=>{setCurTrip(st.trip);setCurChecked(new Set(st.checkedItems));setEditTrip(null);setNav('packing');};
  // "← Edit Trip" in PackingView — go back to plan form pre-filled with current trip data
  const handleEditTrip=()=>{setEditTrip(curTrip);setNav('plan');};

  const showHeader=nav!=='welcome';
  return (
    <div className="app">
      {showHeader&&(
        <div className="app-header">
          <div className="logo" onClick={()=>setNav('welcome')}>
            <div className="logo-mark">🧳</div>
            <span className="logo-text">Packed.</span>
            {isDemo&&<span className="logo-badge">DEMO</span>}
          </div>
          <nav className="app-nav">
            <button className={`nav-btn${nav==='closet'?' active':''}`} onClick={()=>setNav('closet')}>👗 Closet {wardrobe.length>0&&<span className="nav-count">{wardrobe.length}</span>}</button>
            <button className={`nav-btn${nav==='inspo'?' active':''}`} onClick={()=>setNav('inspo')}>🖼️ Inspo</button>
            <button className={`nav-btn${nav==='plan'?' active':''}`} onClick={()=>{setEditTrip(null);setNav('plan');}}>🗺️ Plan Trip</button>
            <button className={`nav-btn${nav==='trips'?' active':''}`} onClick={()=>setNav('trips')}>💾 Trips {trips.length>0&&<span className="nav-count">{trips.length}</span>}</button>
          </nav>
        </div>
      )}

      {isDemo&&showHeader&&(
        <div className="demo-banner">
          <div className="demo-banner-icon">🎭</div>
          <div className="demo-banner-text"><strong>Demo Mode</strong><span>— You're exploring with 10 real sample items. Go to Plan Trip to see it all in action.</span></div>
          <button className="btn btn-outline btn-sm" onClick={clearDemo} style={{flexShrink:0}}>Exit Demo</button>
          <button className="btn btn-sky btn-sm" onClick={()=>setNav('plan')} style={{flexShrink:0}}>Plan a Trip →</button>
        </div>
      )}

      <div className="app-content">
        {nav==='welcome'&&<Welcome onDemo={startDemo} onOwn={startOwn} isDemo={isDemo} onClearDemo={clearDemo}/>}
        {nav==='closet'&&<ClosetView wardrobe={wardrobe} setWardrobe={setWardrobe} savedOutfits={savedOutfits} setSavedOutfits={setSavedOutfits}/>}
        {nav==='inspo'&&<InspoView board={board} setBoard={setBoard}/>}
        {nav==='plan'&&<TripSetup wardrobe={wardrobe} savedOutfits={savedOutfits} board={board} onTrip={handleTrip} onBack={()=>setNav('closet')} initialTrip={editTrip}/>}
        {nav==='packing'&&curTrip&&<PackingView trip={curTrip} wardrobe={wardrobe} savedOutfits={savedOutfits} board={board} initChecked={curChecked} onSave={handleSaveTrip} onBack={()=>setNav('plan')} onGoTrips={()=>setNav('trips')} onEditTrip={handleEditTrip}/>}
        {nav==='trips'&&<TripsView trips={trips} onLoad={handleLoadTrip} onDelete={id=>setTrips(p=>p.filter(t=>t.id!==id))} onExportAll={exportData} onImport={importData} onExportTrip={exportTripData} downloadedTrips={downloadedTrips}/>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
