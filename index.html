<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Packed. — Your Smart Trip Planner</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,700&family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      /* Packed. — Refined Travel Palette */
      --bg:      #f6f3ed;   /* warm linen */
      --bg2:     #ffffff;
      --bg3:     #eee9de;   /* sand dune */
      --bg4:     #e5dfd3;
      --border:  #ddd7ca;
      --border2: #c9c1b0;
      --text:    #1a1624;   /* deep ink */
      --text2:   #5c5168;
      --text3:   #a094aa;
      --sky:     #1e6fb5;   /* deep mediterranean */
      --sky2:    #3b90d4;
      --coral:   #c9533a;   /* terracotta */
      --coral2:  #e07255;
      --sun:     #e8a020;   /* warm amber */
      --mint:    #1d8f72;   /* deep botanical */
      --lavender:#7459c8;
      --green:   #2d9455;
      --red:     #c94040;
      --brand:   #1a1624;   /* brand mark color */
      --shadow-sm: 0 1px 4px rgba(26,22,36,0.07);
      --shadow:    0 4px 16px rgba(26,22,36,0.10);
      --shadow-lg: 0 8px 32px rgba(26,22,36,0.14);
      --r: 14px;
      --r2: 9px;
    }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
    h1,h2,h3,h4 { font-family: 'Playfair Display', serif; }
    #root { height: 100%; }

    /* ── App shell ── */
    .app { display: flex; flex-direction: column; height: 100vh; }
    .app-header {
      background: rgba(246,243,237,0.97); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0 20px; height: 72px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100; flex-shrink: 0;
    }
    .logo { display: flex; align-items: center; gap: 11px; text-decoration: none; cursor: pointer; }
    .logo-mark { width: 44px; height: 44px; background: linear-gradient(135deg, #FF7043 0%, #D84315 100%); border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 3px 12px rgba(255,112,67,0.35); font-size: 1.45rem; }
    .logo-text { font-family: 'Playfair Display', serif; font-size: 3.2rem; font-style: normal; font-weight: 700; background: linear-gradient(110deg, #FF7043 0%, #D84315 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; letter-spacing: -0.02em; line-height: 1; }
    .logo-badge { font-size: 0.65rem; font-weight: 700; color: var(--coral); background: rgba(201,83,58,0.1); border: 1px solid rgba(201,83,58,0.28); border-radius: 20px; padding: 2px 8px; letter-spacing: 0.04em; align-self: flex-start; margin-top: 4px; }
    /* Page-level brand watermark */
    .page-brand { display: flex; align-items: center; gap: 7px; margin-bottom: 6px; }
    .page-brand-text { font-family: 'Cormorant Garamond', serif; font-size: 0.85rem; font-style: italic; font-weight: 600; color: var(--text3); letter-spacing: 0.01em; }
    .app-nav { display: flex; gap: 2px; }
    .nav-btn { padding: 6px 13px; border-radius: 8px; border: none; background: transparent; color: var(--text2); font-size: 0.79rem; font-weight: 500; cursor: pointer; transition: all .15s; display: flex; align-items: center; gap: 5px; font-family: 'Inter', sans-serif; white-space: nowrap; }
    .nav-btn.active { background: var(--sky); color: #fff; box-shadow: 0 2px 8px rgba(41,128,196,0.3); }
    .nav-btn:hover:not(.active) { background: var(--bg3); color: var(--text); }
    .nav-count { background: var(--coral); color: #fff; border-radius: 10px; padding: 1px 5px; font-size: 0.62rem; font-weight: 700; }
    .app-content { flex: 1; overflow-y: auto; }
    .page { max-width: 1100px; margin: 0 auto; padding: 28px 20px 60px; }

    /* ── Demo Banner ── */
    .demo-banner {
      background: linear-gradient(135deg, #fff8ec, #fef3ea);
      border-bottom: 2px solid var(--sun);
      padding: 10px 20px;
      display: flex; align-items: center; gap: 12px;
      font-size: 0.83rem;
    }
    .demo-banner-icon { font-size: 1.3rem; flex-shrink: 0; }
    .demo-banner-text { flex: 1; }
    .demo-banner-text strong { color: var(--coral); }
    .demo-banner-text span { color: var(--text2); margin-left: 4px; }

    /* ── Buttons ── */
    .btn { padding: 10px 22px; border-radius: 10px; border: none; font-size: 0.86rem; font-weight: 600; cursor: pointer; transition: all .16s; display: inline-flex; align-items: center; gap: 7px; font-family: 'Inter', sans-serif; }
    .btn-sky { background: var(--sky); color: #fff; box-shadow: 0 3px 12px rgba(41,128,196,0.28); }
    .btn-sky:hover { background: #1f70b0; transform: translateY(-1px); box-shadow: 0 5px 16px rgba(41,128,196,0.35); }
    .btn-coral { background: var(--coral); color: #fff; box-shadow: 0 3px 12px rgba(232,115,78,0.28); }
    .btn-coral:hover { background: #d45e3a; transform: translateY(-1px); }
    .btn-outline { background: #edf4fb; border: 1.5px solid #c8dff2; color: var(--text); }
    .btn-outline:hover { background: #deeefa; border-color: var(--sky); }
    .btn-ghost { background: transparent; color: var(--text2); padding: 7px 13px; }
    .btn-ghost:hover { background: var(--bg3); color: var(--text); }
    .btn-danger { background: rgba(217,79,79,0.1); border: 1px solid rgba(217,79,79,0.25); color: var(--red); }
    .btn-danger:hover { background: rgba(217,79,79,0.18); }
    .btn-sm { padding: 6px 13px; font-size: 0.78rem; border-radius: 8px; }
    .btn-xs { padding: 4px 10px; font-size: 0.72rem; border-radius: 6px; }
    .icon-btn { width: 32px; height: 32px; border-radius: 8px; border: 1.5px solid var(--border); background: var(--bg2); color: var(--text2); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; transition: all .14s; }
    .icon-btn:hover { background: var(--bg3); color: var(--text); border-color: var(--border2); }

    /* ── Cards ── */
    .card { background: linear-gradient(135deg, #edf5fc 0%, #f0faf7 100%); border: 1px solid #c8dff2; border-radius: var(--r); padding: 20px; box-shadow: var(--shadow-sm); }
    .card-flat { background: linear-gradient(135deg, #edf5fc 0%, #f0faf7 100%); border: 1px solid #c8dff2; border-radius: var(--r); }

    /* ── Forms ── */
    input, select, textarea { background: #edf4fb; border: 1.5px solid #c8dff2; border-radius: var(--r2); color: var(--text); font-family: 'Inter', sans-serif; font-size: 0.88rem; padding: 10px 13px; width: 100%; outline: none; transition: border .15s, box-shadow .15s; }
    input[type=date] { background: #edf4fb; }
    input:focus, select:focus, textarea:focus { border-color: var(--sky); box-shadow: 0 0 0 3px rgba(41,128,196,0.14); background: #e5f0fa; }
    textarea { resize: vertical; min-height: 70px; }
    label { font-size: 0.76rem; font-weight: 600; color: var(--text2); display: block; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.04em; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-group { margin-bottom: 16px; }
    select option { background: #edf4fb; }

    /* ── Tags / Badges ── */
    .tag { display: inline-flex; align-items: center; gap: 4px; padding: 5px 12px; border-radius: 20px; font-size: 0.78rem; font-weight: 500; background: var(--bg3); border: 1.5px solid var(--border); color: var(--text2); cursor: pointer; transition: all .14s; user-select: none; }
    .tag.sel { background: rgba(41,128,196,0.1); border-color: rgba(41,128,196,0.4); color: var(--sky); }
    .tag.sel-coral { background: rgba(232,115,78,0.1); border-color: rgba(232,115,78,0.4); color: var(--coral); }
    .tag:hover:not(.sel):not(.sel-coral) { background: var(--bg4); color: var(--text); }
    .tag-wrap { display: flex; flex-wrap: wrap; gap: 6px; }
    .badge { display: inline-flex; align-items: center; gap: 3px; padding: 3px 9px; border-radius: 20px; font-size: 0.71rem; font-weight: 600; }
    .badge-sky { background: rgba(41,128,196,0.12); color: var(--sky); border: 1px solid rgba(41,128,196,0.25); }
    .badge-coral { background: rgba(232,115,78,0.12); color: var(--coral); border: 1px solid rgba(232,115,78,0.25); }
    .badge-sun { background: rgba(245,185,62,0.15); color: #b8820a; border: 1px solid rgba(245,185,62,0.35); }
    .badge-green { background: rgba(61,170,106,0.12); color: var(--green); border: 1px solid rgba(61,170,106,0.25); }
    .badge-mint { background: rgba(53,184,154,0.12); color: var(--mint); border: 1px solid rgba(53,184,154,0.25); }
    .badge-demo { background: rgba(245,185,62,0.18); color: #9a6a00; border: 1px solid rgba(245,185,62,0.4); }

    /* ── Tabs ── */
    .tabs { display: flex; gap: 0; border-bottom: 2px solid var(--border); margin-bottom: 22px; }
    .tab { padding: 10px 18px; border: none; background: transparent; color: var(--text3); font-size: 0.83rem; font-weight: 600; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all .15s; font-family: 'Inter', sans-serif; white-space: nowrap; }
    .tab.active { color: var(--sky); border-bottom-color: var(--sky); }
    .tab:hover:not(.active) { color: var(--text2); }

    /* ── Modal ── */
    .modal-bg { position: fixed; inset: 0; background: rgba(28,24,40,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 16px; backdrop-filter: blur(4px); }
    .modal { background: linear-gradient(160deg, #edf5fc 0%, #f0faf7 60%, #fdf0ec 100%); border: 1px solid #c8dff2; border-radius: 18px; padding: 28px; max-width: 520px; width: 100%; max-height: 92vh; overflow-y: auto; box-shadow: var(--shadow-lg); }
    .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
    .modal-title { font-size: 1.25rem; }
    .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--border); }

    /* ── Drop Zone ── */
    .dz { border: 2px dashed #a8cfc0; border-radius: var(--r); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: all .2s; overflow: hidden; background: linear-gradient(135deg, #e8f4f1, #edf5fc); }
    .dz:hover, .dz.over { border-color: var(--sky); background: rgba(29,143,114,0.07); }
    .dz.over { transform: scale(1.01); border-style: solid; }
    .dz img { width: 100%; height: 100%; object-fit: cover; }
    .dz-hint { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px; text-align: center; pointer-events: none; }
    .dz-icon { font-size: 1.8rem; }
    .dz-main { font-size: 0.82rem; font-weight: 600; color: var(--text2); }
    .dz-sub { font-size: 0.72rem; color: var(--text3); }

    /* ── Symmetric Item Grid ── */
    .item-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    @media (min-width: 480px) { .item-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 720px) { .item-grid { grid-template-columns: repeat(4, 1fr); } }
    @media (min-width: 960px) { .item-grid { grid-template-columns: repeat(5, 1fr); } }

    .item-card { background: var(--bg2); border: 1.5px solid var(--border); border-radius: var(--r); overflow: hidden; cursor: pointer; transition: all .18s; position: relative; }
    .item-card:hover { border-color: var(--sky); transform: translateY(-3px); box-shadow: var(--shadow); }
    .item-card.hero { border-color: var(--sun); box-shadow: 0 0 0 2px rgba(245,185,62,0.3); }
    .item-card.selected { border-color: var(--sky); box-shadow: 0 0 0 2px rgba(41,128,196,0.2); }
    .item-thumb { width: 100%; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .item-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .item-swatch { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    .item-emoji { font-size: 2.4rem; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.15)); }
    .item-info { padding: 8px 9px 9px; border-top: 1px solid var(--border); }
    .item-name { font-size: 0.75rem; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 1px; }
    .item-sub { font-size: 0.67rem; color: var(--text3); }
    .item-pin { position: absolute; top: 5px; right: 5px; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.6rem; box-shadow: var(--shadow-sm); }
    .item-pin-hero { background: var(--sun); }
    .item-pin-sel { background: var(--sky); color: #fff; font-weight: 700; }

    /* ── Symmetric Outfit Grid ── */
    .outfit-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
    @media (min-width: 600px) { .outfit-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 960px) { .outfit-grid { grid-template-columns: repeat(3, 1fr); } }

    .outfit-card { background: var(--bg2); border: 1.5px solid var(--border); border-radius: var(--r); overflow: hidden; transition: all .18s; box-shadow: var(--shadow-sm); }
    .outfit-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); border-color: var(--border2); }
    .outfit-card.hero { border-color: var(--sun); background: linear-gradient(160deg, #fffbf0 0%, var(--bg2) 60%); }
    .outfit-card.packed { border-color: var(--mint); background: linear-gradient(160deg, #f0fdf7 0%, var(--bg2) 60%); }
    .outfit-photos { display: flex; height: 120px; }
    .outfit-photo { flex: 1; overflow: hidden; display: flex; align-items: center; justify-content: center; border-right: 1px solid var(--border); position: relative; }
    .outfit-photo:last-child { border-right: none; }
    .outfit-photo img { width: 100%; height: 100%; object-fit: cover; }
    .outfit-swatch { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    .outfit-emoji { font-size: 2rem; filter: drop-shadow(0 1px 3px rgba(0,0,0,0.15)); }
    .outfit-body { padding: 13px 14px; }
    .outfit-name { font-size: 0.9rem; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin-bottom: 7px; }
    .outfit-score-row { display: flex; align-items: center; gap: 9px; margin-bottom: 8px; }
    .score-bar { flex: 1; height: 5px; background: var(--bg4); border-radius: 3px; overflow: hidden; }
    .score-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--sky), var(--mint)); }
    .score-pct { font-size: 0.74rem; font-weight: 700; color: var(--sky); min-width: 35px; }
    .outfit-pieces { display: flex; flex-wrap: wrap; gap: 4px; }
    .piece-tag { font-size: 0.69rem; padding: 2px 8px; background: var(--bg3); border-radius: 20px; color: var(--text2); }
    .outfit-footer { padding: 9px 14px; border-top: 1px solid var(--border); display: flex; align-items: center; }
    .pack-label { display: flex; align-items: center; gap: 8px; font-size: 0.81rem; color: var(--text2); cursor: pointer; flex: 1; user-select: none; }
    .pack-label input[type=checkbox] { width: 15px; height: 15px; accent-color: var(--mint); flex-shrink: 0; }
    .pack-label.done { color: var(--mint); font-weight: 600; }

    /* ── Inspo Grid ── */
    .inspo-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    @media (min-width: 480px) { .inspo-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 720px) { .inspo-grid { grid-template-columns: repeat(4, 1fr); } }
    .inspo-card { border-radius: 10px; overflow: hidden; position: relative; aspect-ratio: 3/4; cursor: pointer; border: 2px solid transparent; transition: all .18s; box-shadow: var(--shadow-sm); }
    .inspo-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
    .inspo-card.tagged { border-color: var(--lavender); }
    .inspo-card img { width: 100%; height: 100%; object-fit: cover; }
    .inspo-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(28,24,40,0.75) 0%, transparent 55%); opacity: 0; transition: opacity .18s; display: flex; flex-direction: column; justify-content: flex-end; padding: 9px; }
    .inspo-card:hover .inspo-overlay, .inspo-card.tagged .inspo-overlay { opacity: 1; }
    .inspo-vibe-tags { display: flex; flex-wrap: wrap; gap: 3px; }
    .inspo-vibe { font-size: 0.63rem; padding: 2px 6px; background: rgba(139,116,212,0.6); border-radius: 10px; color: #fff; font-weight: 500; }

    /* ── Progress (Sticky) ── */
    .sticky-progress { position: sticky; top: 58px; z-index: 50; background: rgba(247,244,238,0.97); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); padding: 12px 20px; }
    .sticky-progress-inner { max-width: 1100px; margin: 0 auto; }
    .prog-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 0.84rem; }
    .prog-label { font-weight: 600; color: var(--text); }
    .prog-pct { font-weight: 700; font-size: 0.95rem; }
    .prog-bar { height: 8px; background: var(--bg4); border-radius: 4px; overflow: hidden; }
    .prog-fill { height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--sky), var(--mint)); transition: width .5s cubic-bezier(.4,0,.2,1); }

    /* ── Pack items ── */
    .pack-section { margin-bottom: 24px; }
    .sec-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .sec-title { font-size: 0.85rem; font-weight: 700; color: var(--text2); display: flex; align-items: center; gap: 7px; }
    .pack-item { display: flex; align-items: center; gap: 10px; padding: 9px 13px; background: linear-gradient(135deg, #edf5fc, #f0faf7); border: 1.5px solid #c8dff2; border-radius: 9px; margin-bottom: 6px; transition: all .13s; box-shadow: var(--shadow-sm); }
    .pack-item.done { opacity: 0.42; }
    .pack-item.done .pi-name { text-decoration: line-through; }
    .pack-item input[type=checkbox] { width: 15px; height: 15px; accent-color: var(--mint); flex-shrink: 0; cursor: pointer; }
    .pi-thumb { width: 36px; height: 36px; border-radius: 7px; overflow: hidden; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .pi-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .pi-name { font-size: 0.85rem; font-weight: 500; flex: 1; }
    .pi-color { font-size: 0.72rem; color: var(--text3); }

    /* ── Weather card ── */
    .weather-card { display: flex; align-items: center; gap: 16px; background: linear-gradient(135deg, rgba(41,128,196,0.07), rgba(53,184,154,0.07)); border: 1px solid rgba(41,128,196,0.18); border-radius: var(--r); padding: 15px 18px; }
    .wc-icon { font-size: 2.4rem; }
    .wc-temp { font-size: 1.55rem; font-weight: 700; color: var(--sky); font-family: 'Playfair Display', serif; }
    .wc-desc { font-size: 0.8rem; color: var(--text2); margin-top: 2px; }
    .wc-note { font-size: 0.7rem; color: var(--text3); margin-top: 2px; }

    /* ── Wizard steps ── */
    .wiz-row { display: flex; align-items: flex-start; margin-bottom: 28px; gap: 0; }
    .wiz-step-wrap { display: flex; flex-direction: column; align-items: center; flex: 1; }
    .wiz-dot { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 700; border: 2px solid #c8dff2; color: var(--text3); background: #edf4fb; transition: all .3s; margin-bottom: 5px; flex-shrink: 0; }
    .wiz-dot.done { background: var(--mint); border-color: var(--mint); color: #fff; }
    .wiz-dot.active { background: var(--sky); border-color: var(--sky); color: #fff; box-shadow: 0 0 0 4px rgba(41,128,196,0.18); }
    .wiz-lbl { font-size: 0.68rem; font-weight: 600; color: var(--text3); text-align: center; }
    .wiz-lbl.active { color: var(--sky); }
    .wiz-lbl.done { color: var(--mint); }
    .wiz-line { flex: 1; height: 2px; background: var(--border); margin-top: 15px; transition: background .3s; }
    .wiz-line.done { background: var(--mint); }

    /* ── Sliders ── */
    .slider-row { margin-bottom: 12px; }
    .slider-lbl { display: flex; justify-content: space-between; font-size: 0.79rem; margin-bottom: 5px; }
    .slider-lbl-left { color: var(--text2); }
    .slider-lbl-right { font-weight: 700; color: var(--sky); }
    input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 4px; background: var(--bg4); border-radius: 2px; outline: none; padding: 0; cursor: pointer; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--sky); cursor: pointer; border: 2px solid #fff; box-shadow: 0 2px 6px rgba(41,128,196,0.35); }

    /* ── DNA bars ── */
    .dna-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }

const COLOR_NAMES=[['White',[245,245,245]],['Cream',[240,230,200]],['Beige',[215,195,160]],['Sand',[200,180,140]],['Tan',[185,155,110]],['Camel',[190,140,80]],['Brown',[130,85,50]],['Black',[30,30,30]],['Charcoal',[70,70,75]],['Gray',[150,150,155]],['Silver',[195,195,205]],['Navy',[30,40,90]],['Blue',[50,90,180]],['Sky Blue',[90,160,225]],['Teal',[35,145,145]],['Mint',[140,220,190]],['Green',[55,150,75]],['Olive',[100,115,55]],['Yellow',[240,210,60]],['Gold',[210,170,50]],['Orange',[220,120,50]],['Terracotta',[185,90,60]],['Coral',[235,110,90]],['Red',[195,50,55]],['Burgundy',[120,30,45]],['Pink',[235,155,175]],['Dusty Rose',[200,140,145]],['Blush',[235,195,195]],['Lavender',[170,140,205]],['Purple',[120,60,160]],['Natural',[205,185,155]],['Denim Blue',[90,115,170]],['Floral Multi',[180,150,120]]];
function guessColorName(r,g,b){let best=COLOR_NAMES[0],dist=Infinity;COLOR_NAMES.forEach(([n,[cr,cg,cb]])=>{const d=(r-cr)*(r-cr)+(g-cg)*(g-cg)+(b-cb)*(b-cb);if(d<dist){dist=d;best=[n,[cr,cg,cb]];}});return best[0];}
function guessWarmth(r,g,b){const brightness=(r+g+b)/3;const warmScore=r-b;if(brightness>220)return 1;if(brightness<60)return 3;if(warmScore>40)return 1;if(warmScore<-30)return 2;return 2;}

// ─── Smart color-palette → aesthetic mapping ──────────────────────────────────
function guessAesthetics(r,g,b,colorName=''){
  const brightness=(r+g+b)/3;
  const saturation=Math.max(r,g,b)-Math.min(r,g,b);
  const warmth=r-b; // positive=warm, negative=cool
  const out=[];
  const add=a=>{if(!out.includes(a))out.push(a);};

  // Very desaturated neutrals → minimalist / quiet-luxury / chic
  if(saturation<38){
    if(brightness>195){add('minimalist');add('quiet-luxury');}
    else if(brightness>105){add('minimalist');add('chic');}
    else{add('quiet-luxury');add('chic');}
  }
  // Warm earthy mid-tones (sand, tan, camel, terracotta, brown)
  else if(warmth>22&&brightness>65&&brightness<215&&saturation<115){
    add('resort');add('boho');
    if(brightness>160)add('minimalist');
  }
  // Warm + saturated (coral, orange, gold, terracotta bright)
  else if(warmth>50&&saturation>85){
    add('bold');add('resort');
    if(brightness>155)add('artsy');
  }
  // Cool blues, teals, ocean greens
  else if(warmth<-28&&saturation>45){
    add('resort');add('casual');
    if(saturation>100)add('artsy');
  }
  // Pastels — high brightness, light saturation
  else if(brightness>185&&saturation>18&&saturation<90){
    add('chic');add('casual');
    if(r>g+20&&r>b+20)add('boho'); // pinkish pastels → boho
  }
  // Very vivid / highly saturated
  else if(saturation>125){
    add('bold');add('artsy');
    if(warmth>0)add('resort');
  }
  // Deep rich darks (charcoal, deep jewel tones)
  else if(brightness<75){
    add('quiet-luxury');add('chic');
  }
  // Fallback mid-range warm → resort/casual
  else{
    if(warmth>8){add('resort');}else{add('casual');}
    if(saturation>60)add('artsy');
  }

  // Specific named-color overrides
  if(/natural|sand|camel|beige|oatmeal/i.test(colorName)){add('resort');add('minimalist');}
  if(/black|charcoal/i.test(colorName)){add('quiet-luxury');add('minimalist');}
  if(/white|cream/i.test(colorName)){add('minimalist');add('quiet-luxury');}
  if(/floral|multi/i.test(colorName)){add('artsy');add('boho');}

  return out.slice(0,3);
}

function guessTypeFromFilename(name){const n=name.toLowerCase();if(/dress|gown|romper|jumpsuit/.test(n))return'dress';if(/skirt/.test(n))return'bottom';if(/pant|trouser|short|jean|denim/.test(n))return'bottom';if(/shoe|heel|sneaker|sandal|boot|flat|wedge|espadri/.test(n))return'shoes';if(/jacket|coat|blazer|cardigan|hoodie|sweater/.test(n))return'outerwear';if(/swim|bikini|one.piece|bathing/.test(n))return'swimwear';if(/bag|purse|tote|clutch/.test(n))return'bag';if(/hat|earring|necklace|bracelet|belt|scarf|jewelry|sunglass/.test(n))return'accessory';return'top';}
function cleanFilename(name){return name.replace(/\.[^.]+$/,'').replace(/[-_]/g,' ').replace(/\b\w/g,c=>c.toUpperCase()).trim();}
async function analyzePhoto(src,filename=''){
  return new Promise(resolve=>{
    const img=new Image();
    img.crossOrigin='anonymous';
    img.onload=()=>{
      try{
        const c=document.createElement('canvas');c.width=60;c.height=60;
        const ctx=c.getContext('2d');ctx.drawImage(img,0,0,60,60);
        const data=ctx.getImageData(0,0,60,60).data;
        let rs=0,gs=0,bs=0,n=0;
        for(let i=0;i<data.length;i+=16){rs+=data[i];gs+=data[i+1];bs+=data[i+2];n++;}
        const r=Math.round(rs/n),g=Math.round(gs/n),b=Math.round(bs/n);
        const colorName=guessColorName(r,g,b);
        resolve({colorName,warmth:guessWarmth(r,g,b),type:guessTypeFromFilename(filename),name:cleanFilename(filename)||'',bg:`rgb(${r},${g},${b})`,aesthetics:guessAesthetics(r,g,b,colorName)});
      }catch(e){resolve({colorName:'',warmth:2,type:guessTypeFromFilename(filename),name:cleanFilename(filename)||'',bg:null,aesthetics:[]});}
    };
    img.onerror=()=>resolve({colorName:'',warmth:2,type:guessTypeFromFilename(filename),name:cleanFilename(filename)||'',bg:null,aesthetics:[]});
    img.src=src;
  });
}

async function getWeather(dest, start, days) {
  const gr = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(dest)}&count=1&language=en&format=json`);
  const gd = await gr.json();

  const {latitude:lat,longitude:lon,name,country} = gd.results[0];
  const s = new Date(start); const today = new Date(); today.setHours(0,0,0,0);
  const isForecast = (s-today)/86400000 <= 15;
  const fmt = d => d.toISOString().split('T')[0];
  let url; if(isForecast){const e=new Date(s);e.setDate(e.getDate()+days-1);url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=temperature_2m_max,temperature_2m_min,weathercode&temperature_unit=celsius&start_date=${fmt(s)}&end_date=${fmt(e)}&timezone=auto`;}
  else{const hs=new Date(s);hs.setFullYear(hs.getFullYear()-1);const he=new Date(hs);he.setDate(he.getDate()+days-1);url=`https://archive-api.open-meteo.com/v1/archive?latitude=${lat}&longitude=${lon}&daily=temperature_2m_max,temperature_2m_min,weathercode&temperature_unit=celsius&start_date=${fmt(hs)}&end_date=${fmt(he)}&timezone=auto`;}
  const wd = await (await fetch(url)).json();
  const mx=wd.daily?.temperature_2m_max||[],mn=wd.daily?.temperature_2m_min||[],cd=wd.daily?.weathercode||[];
  const avgMx=mx.reduce((a,b)=>a+b,0)/mx.length||22,avgMn=mn.reduce((a,b)=>a+b,0)/mn.length||16;
  const cc={}; cd.forEach(c=>{cc[c]=(cc[c]||0)+1;});
  const mc=Object.entries(cc).sort((a,b)=>b[1]-a[1])[0]?.[0];
  return {min:Math.round(avgMn),max:Math.round(avgMx),conditions:WMO[+mc]||'Variable',hasRain:cd.some(c=>c>=51),fetched:true,isForecast,location:`${name}, ${country}`};
}

function buildOutfits(wardrobe, trip, weather) {
  if(!wardrobe?.length) return [];
  const avg=(weather?.min+weather?.max)/2||22, aw=trip?.aesthetics||{}, hi=new Set(trip?.heroItems||[]);
  const acts=trip?.activities||[]; const avgF=acts.length?acts.map(a=>ACTIVITIES.find(x=>x.value===a)?.f||2).reduce((a,b)=>a+b,0)/acts.length:2;
  const score=item=>{let s=0;(item.aesthetics||[]).forEach(a=>{s+=(aw[a]||0)/100*4;});const wt=avg>26?1:avg>20?2:avg>14?3:avg>8?4:5;s-=Math.abs((item.warmth||3)-wt)*0.6;s-=Math.abs((item.formality||2)-avgF)*0.4;if(hi.has(item.id))s+=6;return s;};
  const by=t=>wardrobe.filter(i=>i.type===t).sort((a,b)=>score(b)-score(a));
  const tops=by('top'),btms=by('bottom'),drss=wardrobe.filter(i=>['dress','set'].includes(i.type)).sort((a,b)=>score(b)-score(a));
  const shoeArr=by('shoes'),outArr=by('outerwear'),accArr=by('accessory');
  const sh=shoeArr[0],ou=outArr[0],ac=accArr[0]; const needOuter=avg<16;
  const combos=[]; const seen=new Set();
  tops.forEach(top=>btms.forEach(btm=>{const k=[top.id,btm.id].sort().join('|');if(seen.has(k))return;seen.add(k);const items=[top,btm,...(sh?[sh]:[]),...(needOuter&&ou?[ou]:[]),...(ac?[ac]:[])];combos.push({id:`tb-${top.id}-${btm.id}`,items,sc:score(top)+score(btm)+(sh?score(sh)*.5:0),hero:items.some(i=>hi.has(i.id)),type:'top+btm'});}));
  drss.forEach(d=>{const items=[d,...(sh?[sh]:[]),...(needOuter&&ou?[ou]:[]),...(ac?[ac]:[])];combos.push({id:`d-${d.id}`,items,sc:score(d)+(sh?score(sh)*.5:0),hero:items.some(i=>hi.has(i.id)),type:'dress'});});
  combos.sort((a,b)=>a.hero&&!b.hero?-1:!a.hero&&b.hero?1:b.sc-a.sc);
  const mx=combos[0]?.sc||10;
  const names=['Effortless','Polished','Breezy','Classic','Vibrant','Sunset','Garden','Coastal','Urban','Chic','Resort','Golden','Riviera','Palms'];
  return combos.slice(0,14).map((c,i)=>({...c,pct:Math.max(30,Math.min(99,Math.round(c.sc/mx*100))),label:c.hero?'⭐ Signature Look':`${names[i%names.length]} ${c.type==='dress'?'Look':'Outfit'}`}));
}

function buildEssentials(trip, weather) {

// ─── Outfit count recommendation ─────────────────────────────────────────────
function calcOutfitRange(days=5, luggage='carry-on', weather=null){
  const luggageArr=Array.isArray(luggage)?luggage:[luggage];
  const avg=weather?(weather.min+weather.max)/2:22;
  const hot=avg>=26, cold=avg<=14, variable=weather?.hasRain;
  let base=Math.ceil(days*0.7);
  const CAP={personal:3,'carry-on':6,checked:12,both:10};
  // If user brings both personal + carry-on, use the 'both' cap (10)
  const hasBothPersonalCarry=luggageArr.includes('personal')&&luggageArr.includes('carry-on');
  const maxCap=hasBothPersonalCarry?10:Math.max(...luggageArr.map(l=>CAP[l]||6));
  if(hot||variable)base=Math.ceil(base*1.2);
  if(cold)base=Math.max(base,Math.ceil(days*0.5));
  const min=Math.max(2,Math.min(base,maxCap));
  // Always guarantee a true range (max at least min+1)
  let max=Math.min(maxCap,min+Math.max(1,Math.ceil(days*0.3)));
  if(max<=min) max=min+1;
  return {min,max};
}

// ─── DropZone ─────────────────────────────────────────────────────────────────
function DZ({ onFile, preview, height=130, hint='Drag & drop or click to browse', multi=false }) {
  const [over, setOver] = useState(false);
  const ref = useRef();
  const read = useCallback(f=>{ if(!f||!f.type.startsWith('image/')) return; const r=new FileReader(); r.onload=e=>onFile(e.target.result,f); r.readAsDataURL(f); },[onFile]);
  const onDrop = useCallback(e=>{ e.preventDefault(); setOver(false); Array.from(e.dataTransfer.files).forEach(read); },[read]);
  return (
    <div className={`dz${over?' over':''}`} style={{height}} onDragOver={e=>{e.preventDefault();setOver(true);}} onDragEnter={e=>{e.preventDefault();setOver(true);}} onDragLeave={()=>setOver(false)} onDrop={onDrop} onClick={()=>ref.current.click()}>
      {preview?<img src={preview} alt="" style={{width:'100%',height:'100%',objectFit:'cover'}}/>:(<div className="dz-hint"><div className="dz-icon">{over?'📂':'📎'}</div><div className="dz-main">{over?'Drop it!':hint}</div>{multi&&<div className="dz-sub">Multiple images OK</div>}</div>)}
      <input ref={ref} type="file" accept="image/*" multiple={multi} style={{display:'none'}} onChange={e=>{Array.from(e.target.files).forEach(read);e.target.value='';}}/>

  );
}
